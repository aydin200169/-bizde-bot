<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>BIZDE.KZ — Admin</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#08090b;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:25px;
}

.logo{
    font-size:25px;
    font-weight:900;
}

.badge{
    background:#17191d;
    border:1px solid #292c32;
    padding:8px 12px;
    border-radius:12px;
    font-size:12px;
    color:#aaa;
}

h1{
    font-size:28px;
    margin-bottom:7px;
}

.subtitle{
    color:#888;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:20px;
}

.tab{
    border:1px solid #292c32;
    background:#111317;
    color:#aaa;
    padding:11px 16px;
    border-radius:12px;
    white-space:nowrap;
    cursor:pointer;
}

.tab.active{
    background:#fff;
    color:#000;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.card{
    background:#111317;
    border:1px solid #202329;
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

.partner-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.partner-name{
    font-size:19px;
    font-weight:800;
}

.partner-category{
    color:#888;
    font-size:13px;
    margin-top:5px;
}

.discount{
    font-size:22px;
    font-weight:900;
}

.status{
    display:inline-block;
    margin-top:10px;
    padding:6px 10px;
    border-radius:9px;
    font-size:12px;
}

.status.active{
    background:#16351f;
    color:#67e58a;
}

.status.off{
    background:#351719;
    color:#ff7373;
}

.actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:15px;
}

button{
    border:0;
    border-radius:11px;
    padding:11px 15px;
    cursor:pointer;
    font-weight:700;
}

.primary{
    background:#fff;
    color:#000;
}

.secondary{
    background:#202329;
    color:#fff;
}

.danger{
    background:#391719;
    color:#ff7777;
}

.success{
    background:#173821;
    color:#6ee88b;
}

.form{
    display:grid;
    gap:12px;
}

input,
select,
textarea{
    width:100%;
    background:#0b0d10;
    color:#fff;
    border:1px solid #292d33;
    border-radius:12px;
    padding:13px;
    outline:none;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#555;
}

.form-buttons{
    display:flex;
    gap:8px;
    margin-top:5px;
}

.empty{
    text-align:center;
    color:#777;
    padding:35px 10px;
}

.user-name{
    font-size:17px;
    font-weight:800;
}

.user-info{
    color:#888;
    font-size:13px;
    line-height:1.6;
    margin-top:7px;
}

.stat{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:20px;
}

.stat-card{
    background:#111317;
    border:1px solid #202329;
    border-radius:15px;
    padding:15px;
}

.stat-number{
    font-size:22px;
    font-weight:900;
}

.stat-label{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:100;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:500px;
    max-height:90vh;
    overflow:auto;
    background:#111317;
    border:1px solid #292d33;
    border-radius:20px;
    padding:20px;
}

.modal-title{
    font-size:21px;
    font-weight:900;
    margin-bottom:18px;
}

.close{
    float:right;
    background:#202329;
    color:#fff;
    padding:7px 10px;
}

.loading{
    color:#888;
    padding:20px 0;
}

.toast{
    position:fixed;
    left:20px;
    right:20px;
    bottom:20px;
    background:#fff;
    color:#000;
    padding:14px;
    border-radius:13px;
    font-weight:700;
    text-align:center;
    transform:translateY(120px);
    transition:.25s;
    z-index:200;
}

.toast.show{
    transform:translateY(0);
}

@media(max-width:600px){

    body{
        padding:15px;
    }

    .stat{
        grid-template-columns:1fr 1fr;
    }

    .partner-top{
        align-items:flex-start;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="header">

        <div class="logo">
            BIZDE.KZ
        </div>

        <div class="badge">
            ADMIN PANEL
        </div>

    </div>

    <h1>
        Панель управления
    </h1>

    <div class="subtitle">
        Управление партнёрами и участниками BIZDE.KZ
    </div>


    <div class="tabs">

        <button
            class="tab active"
            onclick="showTab('dashboard',this)"
        >
            📊 Обзор
        </button>

        <button
            class="tab"
            onclick="showTab('partners',this)"
        >
            🏪 Партнёры
        </button>

        <button
            class="tab"
            onclick="showTab('users',this)"
        >
            👥 Пользователи
        </button>

    </div>


    <!-- DASHBOARD -->

    <div
        id="dashboard"
        class="section active"
    >

        <div class="stat">

            <div class="stat-card">

                <div
                    class="stat-number"
                    id="statPartners"
                >
                    —
                </div>

                <div class="stat-label">
                    Партнёров
                </div>

            </div>


            <div class="stat-card">

                <div
                    class="stat-number"
                    id="statActive"
                >
                    —
                </div>

                <div class="stat-label">
                    Активных
                </div>

            </div>


            <div class="stat-card">

                <div
                    class="stat-number"
                    id="statUsers"
                >
                    —
                </div>

                <div class="stat-label">
                    Участников
                </div>

            </div>

        </div>


        <div class="card">

            <div class="partner-name">
                BIZDE.KZ
            </div>

            <div class="partner-category">
                Платформа привилегий
            </div>

            <div class="actions">

                <button
                    class="primary"
                    onclick="showTabById('partners')"
                >
                    Управлять партнёрами
                </button>

                <button
                    class="secondary"
                    onclick="showTabById('users')"
                >
                    Управлять пользователями
                </button>

            </div>

        </div>

    </div>


    <!-- PARTNERS -->

    <div
        id="partners"
        class="section"
    >

        <div
            class="actions"
            style="margin-bottom:15px"
        >

            <button
                class="primary"
                onclick="openCreatePartner()"
            >
                + Добавить партнёра
            </button>

            <button
                class="secondary"
                onclick="loadPartners()"
            >
                ↻ Обновить
            </button>

        </div>

        <div id="partnersList">

            <div class="loading">
                Загрузка партнёров...
            </div>

        </div>

    </div>


    <!-- USERS -->

    <div
        id="users"
        class="section"
    >

        <div
            class="actions"
            style="margin-bottom:15px"
        >

            <button
                class="secondary"
                onclick="loadUsers()"
            >
                ↻ Обновить
            </button>

        </div>

        <div id="usersList">

            <div class="loading">
                Загрузка пользователей...
            </div>

        </div>

    </div>

</div>


<!-- PARTNER MODAL -->

<div
    class="modal"
    id="partnerModal"
>

    <div class="modal-box">

        <button
            class="close"
            onclick="closeModal()"
        >
            ✕
        </button>

        <div
            class="modal-title"
            id="modalTitle"
        >
            Добавить партнёра
        </div>


        <div class="form">

            <input
                id="partnerName"
                placeholder="Название партнёра"
            >


            <select id="partnerCategory">

                <option value="restaurant">
                    🍽 Ресторан
                </option>

                <option value="cafe">
                    ☕ Кафе
                </option>

                <option value="sport">
                    🏋️ Спорт
                </option>

                <option value="beauty">
                    💆 Красота
                </option>

                <option value="entertainment">
                    🎮 Развлечения
                </option>

                <option value="shopping">
                    🛍 Магазины
                </option>

                <option value="other">
                    ✨ Другое
                </option>

            </select>


            <input
                id="partnerDiscount"
                type="number"
                min="0"
                max="100"
                placeholder="Размер привилегии, %"
            >


            <input
                id="partnerPhoto"
                placeholder="Ссылка на фото"
            >


            <textarea
                id="partnerDescription"
                placeholder="Описание партнёра"
            ></textarea>


            <textarea
                id="partnerConditions"
                placeholder="Условия привилегии"
            ></textarea>


            <div class="form-buttons">

                <button
                    class="primary"
                    onclick="savePartner()"
                >
                    Сохранить
                </button>

                <button
                    class="secondary"
                    onclick="closeModal()"
                >
                    Отмена
                </button>

            </div>

        </div>

    </div>

</div>


<div
    class="toast"
    id="toast"
></div>


<script>

/* ==========================================
   CONFIG
========================================== */

const tg =
    window.Telegram?.WebApp;

const API_URL =
    "https://bizde-bot.onrender.com";


let partners = [];

let users = [];

let editingPartnerId = null;


/* ==========================================
   TELEGRAM AUTH
========================================== */

async function initTelegram(){

    if(!tg){

        showToast(
            "Откройте админку через Telegram"
        );

        return false;
    }


    tg.ready();

    tg.expand();


    for(
        let i = 0;
        i < 30;
        i++
    ){

        if(
            tg.initData &&
            tg.initDataUnsafe &&
            tg.initDataUnsafe.user
        ){

            console.log(
                "Telegram ID:",
                tg.initDataUnsafe.user.id
            );

            return true;

        }


        await new Promise(
            resolve =>
            setTimeout(
                resolve,
                100
            )
        );

    }


    showToast(
        "Telegram не передал данные авторизации"
    );

    return false;

}


/* ==========================================
   INIT DATA
========================================== */

function getInitData(){

    return tg?.initData || "";

}


/* ==========================================
   API GET
========================================== */

async function apiGet(path){

    const initData =
        getInitData();


    if(!initData){

        throw new Error(
            "Не авторизовано. Откройте админку через Telegram."
        );

    }


    const response =
        await fetch(
            API_URL + path,
            {
                method:"GET",

                headers:{
                    "X-Telegram-Init-Data":
                        initData
                }
            }
        );


    let data = {};


    try{

        data =
            await response.json();

    }catch(e){

        throw new Error(
            "Ошибка ответа сервера"
        );

    }


    if(!response.ok){

        throw new Error(
            data.error ||
            data.message ||
            "Ошибка сервера"
        );

    }


    return data;

}


/* ==========================================
   API POST
========================================== */

async function apiPost(
    path,
    body={}
){

    const initData =
        getInitData();


    if(!initData){

        throw new Error(
            "Не авторизовано. Откройте админку через Telegram."
        );

    }


    const response =
        await fetch(
            API_URL + path,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "X-Telegram-Init-Data":
                        initData
                },

                body:
                    JSON.stringify(body)
            }
        );


    let data = {};


    try{

        data =
            await response.json();

    }catch(e){

        throw new Error(
            "Ошибка ответа сервера"
        );

    }


    if(!response.ok){

        throw new Error(
            data.error ||
            data.message ||
            "Ошибка сервера"
        );

    }


    return data;

}


/* ==========================================
   TABS
========================================== */

function showTab(
    id,
    button
){

    document
        .querySelectorAll(".section")
        .forEach(
            section =>
            section.classList.remove(
                "active"
            )
        );


    document
        .querySelectorAll(".tab")
        .forEach(
            tab =>
            tab.classList.remove(
                "active"
            )
        );


    document
        .getElementById(id)
        .classList.add("active");


    if(button){

        button.classList.add("active");

    }


    if(id === "partners"){

        loadPartners();

    }


    if(id === "users"){

        loadUsers();

    }

}


function showTabById(id){

    const buttons =
        document.querySelectorAll(".tab");


    let target = null;


    buttons.forEach(
        button => {

            const text =
                button.textContent
                .toLowerCase();


            if(
                id === "partners" &&
                text.includes("партнёры")
            ){

                target = button;

            }


            if(
                id === "users" &&
                text.includes("пользователи")
            ){

                target = button;

            }

        }
    );


    showTab(
        id,
        target
    );

}


/* ==========================================
   LOAD PARTNERS
========================================== */

async function loadPartners(){

    const list =
        document.getElementById(
            "partnersList"
        );


    list.innerHTML =
        '<div class="loading">Загрузка...</div>';


    try{

        const data =
            await apiGet(
                "/api/admin/partners"
            );


        partners =
            data.partners || [];


        renderPartners();

        updateStats();

    }catch(error){

        console.error(error);


        list.innerHTML =
            `<div class="empty">
                ❌ ${escapeHtml(
                    error.message
                )}
            </div>`;


        showToast(
            error.message
        );

    }

}


/* ==========================================
   RENDER PARTNERS
========================================== */

function renderPartners(){

    const list =
        document.getElementById(
            "partnersList"
        );


    if(!partners.length){

        list.innerHTML =
            '<div class="empty">Партнёров пока нет.</div>';

        return;

    }


    list.innerHTML =
        partners
        .map(
            partner => {

                const active =
                    Boolean(
                        partner.active
                    );


                return `

                <div class="card">

                    <div class="partner-top">

                        <div>

                            <div class="partner-name">

                                ${escapeHtml(
                                    partner.name
                                )}

                            </div>

                            <div class="partner-category">

                                ${escapeHtml(
                                    partner.category ||
                                    "Другое"
                                )}

                            </div>

                        </div>


                        <div class="discount">

                            ${Number(
                                partner.discount_percent ||
                                0
                            )}%

                        </div>

                    </div>


                    <div class="status ${
                        active
                        ? "active"
                        : "off"
                    }">

                        ${
                            active
                            ? "Активен"
                            : "Отключён"
                        }

                    </div>


                    ${
                        partner.description
                        ?
                        `<div class="user-info">
                            ${escapeHtml(
                                partner.description
                            )}
                        </div>`
                        :
                        ""
                    }


                    <div class="actions">

                        <button
                            class="secondary"
                            onclick="editPartner(
                                ${partner.id}
                            )"
                        >
                            ✏️ Изменить
                        </button>


                        <button
                            class="${
                                active
                                ? "danger"
                                : "success"
                            }"
                            onclick="togglePartner(
                                ${partner.id},
                                ${!active}
                            )"
                        >

                            ${
                                active
                                ? "⏸ Отключить"
                                : "▶️ Включить"
                            }

                        </button>


                        <button
                            class="danger"
                            onclick="deletePartner(
                                ${partner.id}
                            )"
                        >
                            🗑 Удалить
                        </button>

                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* ==========================================
   CREATE PARTNER
========================================== */

function openCreatePartner(){

    editingPartnerId = null;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Добавить партнёра";


    document.getElementById(
        "partnerName"
    ).value = "";


    document.getElementById(
        "partnerCategory"
    ).value =
        "restaurant";


    document.getElementById(
        "partnerDiscount"
    ).value = "";


    document.getElementById(
        "partnerPhoto"
    ).value = "";


    document.getElementById(
        "partnerDescription"
    ).value = "";


    document.getElementById(
        "partnerConditions"
    ).value = "";


    document.getElementById(
        "partnerModal"
    ).classList.add(
        "show"
    );

}


/* ==========================================
   EDIT PARTNER
========================================== */

function editPartner(id){

    const partner =
        partners.find(
            item =>
            Number(item.id) ===
            Number(id)
        );


    if(!partner){

        return;

    }


    editingPartnerId =
        partner.id;


    document.getElementById(
        "modalTitle"
    ).textContent =
        "Изменить партнёра";


    document.getElementById(
        "partnerName"
    ).value =
        partner.name || "";


    document.getElementById(
        "partnerCategory"
    ).value =
        partner.category || "other";


    document.getElementById(
        "partnerDiscount"
    ).value =
        partner.discount_percent || 0;


    document.getElementById(
        "partnerPhoto"
    ).value =
        partner.photo_url || "";


    document.getElementById(
        "partnerDescription"
    ).value =
        partner.description || "";


    document.getElementById(
        "partnerConditions"
    ).value =
        partner.conditions || "";


    document.getElementById(
        "partnerModal"
    ).classList.add(
        "show"
    );

}


/* ==========================================
   SAVE PARTNER
========================================== */

async function savePartner(){

    const data = {

        name:
            document.getElementById(
                "partnerName"
            ).value.trim(),

        category:
            document.getElementById(
                "partnerCategory"
            ).value,

        discount_percent:
            Number(
                document.getElementById(
                    "partnerDiscount"
                ).value || 0
            ),

        photo_url:
            document.getElementById(
                "partnerPhoto"
            ).value.trim(),

        description:
            document.getElementById(
                "partnerDescription"
            ).value.trim(),

        conditions:
            document.getElementById(
                "partnerConditions"
            ).value.trim(),

        active:true

    };


    if(!data.name){

        showToast(
            "Введите название партнёра"
        );

        return;

    }


    if(
        data.discount_percent < 0 ||
        data.discount_percent > 100
    ){

        showToast(
            "Привилегия должна быть от 0 до 100%"
        );

        return;

    }


    try{

        if(editingPartnerId){

            data.id =
                editingPartnerId;


            await apiPost(
                "/api/admin/partners/update",
                data
            );


            showToast(
                "Партнёр обновлён ✅"
            );

        }else{

            await apiPost(
                "/api/admin/partners",
                data
            );


            showToast(
                "Партнёр добавлен ✅"
            );

        }


        closeModal();

        await loadPartners();

    }catch(error){

        showToast(
            error.message
        );

    }

}


/* ==========================================
   TOGGLE PARTNER
========================================== */

async function togglePartner(
    id,
    active
){

    try{

        await apiPost(
            "/api/admin/partners/toggle",
            {
                id:id,
                active:active
            }
        );


        showToast(
            active
            ? "Партнёр включён ✅"
            : "Партнёр отключён"
        );


        await loadPartners();

    }catch(error){

        showToast(
            error.message
        );

    }

}


/* ==========================================
   DELETE PARTNER
========================================== */

async function deletePartner(id){

    const partner =
        partners.find(
            item =>
            Number(item.id) ===
            Number(id)
        );


    if(!partner){

        return;

    }


    const confirmed =
        confirm(
            `Отключить партнёра "${partner.name}"?`
        );


    if(!confirmed){

        return;

    }


    try{

        await apiPost(
            "/api/admin/partners/delete",
            {
                id:id
            }
        );


        showToast(
            "Партнёр отключён"
        );


        await loadPartners();

    }catch(error){

        showToast(
            error.message
        );

    }

}


/* ==========================================
   LOAD USERS
========================================== */

async function loadUsers(){

    const list =
        document.getElementById(
            "usersList"
        );


    list.innerHTML =
        '<div class="loading">Загрузка...</div>';


    try{

        const data =
            await apiGet(
                "/api/admin/users"
            );


        users =
            data.users || [];


        renderUsers();

        updateStats();

    }catch(error){

        console.error(error);


        list.innerHTML =
            `<div class="empty">
                ❌ ${escapeHtml(
                    error.message
                )}
            </div>`;


        showToast(
            error.message
        );

    }

}


/* ==========================================
   RENDER USERS
========================================== */

function renderUsers(){

    const list =
        document.getElementById(
            "usersList"
        );


    if(!users.length){

        list.innerHTML =
            '<div class="empty">Пользователей пока нет.</div>';

        return;

    }


    list.innerHTML =
        users
        .map(
            user => {

                const active =
                    Boolean(
                        user.subscription_active
                    );


                return `

                <div class="card">

                    <div class="user-name">

                        ${escapeHtml(
                            user.name ||
                            "Без имени"
                        )}

                    </div>


                    <div class="user-info">

                        Telegram ID:
                        ${escapeHtml(
                            String(
                                user.telegram_id
                            )
                        )}

                        <br>

                        Username:

                        ${
                            user.username
                            ?
                            "@" +
                            escapeHtml(
                                user.username
                            )
                            :
                            "—"
                        }

                        <br>

                        Телефон:

                        ${
                            user.phone
                            ?
                            escapeHtml(
                                user.phone
                            )
                            :
                            "—"
                        }

                        <br>

                        Код:

                        ${
                            user.member_code
                            ?
                            escapeHtml(
                                user.member_code
                            )
                            :
                            "—"
                        }

                        <br>

                        Всего сэкономлено:

                        ${
                            Number(
                                user.total_savings ||
                                0
                            ).toFixed(2)
                        } ₸

                    </div>


                    <div class="status ${
                        active
                        ? "active"
                        : "off"
                    }">

                        ${
                            active
                            ? "Подписка активна"
                            : "Подписка не активна"
                        }

                    </div>


                    <div class="actions">

                        <button
                            class="${
                                active
                                ? "danger"
                                : "success"
                            }"
                            onclick="changeSubscription(
                                ${user.telegram_id},
                                ${!active}
                            )"
                        >

                            ${
                                active
                                ? "Отключить подписку"
                                : "Активировать подписку"
                            }

                        </button>

                    </div>

                </div>

                `;

            }
        )
        .join("");

}


/* ==========================================
   SUBSCRIPTION
========================================== */

async function changeSubscription(
    telegramId,
    active
){

    try{

        await apiPost(
            "/api/admin/users/subscription",
            {
                telegram_id:telegramId,
                active:active
            }
        );


        showToast(
            active
            ? "Подписка активирована ✅"
            : "Подписка отключена"
        );


        await loadUsers();

    }catch(error){

        showToast(
            error.message
        );

    }

}


/* ==========================================
   STATS
========================================== */

function updateStats(){

    const activePartners =
        partners.filter(
            partner =>
            Boolean(
                partner.active
            )
        ).length;


    document.getElementById(
        "statPartners"
    ).textContent =
        partners.length;


    document.getElementById(
        "statActive"
    ).textContent =
        activePartners;


    document.getElementById(
        "statUsers"
    ).textContent =
        users.length;

}


/* ==========================================
   MODAL
========================================== */

function closeModal(){

    document
        .getElementById(
            "partnerModal"
        )
        .classList.remove(
            "show"
        );

}


/* ==========================================
   TOAST
========================================== */

function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    setTimeout(
        () => {

            toast.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHtml(value){

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================
   START
========================================== */

async function startAdmin(){

    const authorized =
        await initTelegram();


    if(!authorized){

        return;

    }


    try{

        await loadPartners();

        await loadUsers();

        updateStats();


        console.log(
            "BIZDE.KZ ADMIN AUTH OK"
        );

    }catch(error){

        console.error(
            "ADMIN ERROR:",
            error
        );


        showToast(
            error.message
        );

    }

}


startAdmin();

</script>
